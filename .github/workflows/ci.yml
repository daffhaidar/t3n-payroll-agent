name: CI

on:
  push:
    branches: [main, fix/**]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Rust formatting check
        run: cargo fmt --manifest-path contracts/payroll/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path contracts/payroll/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path contracts/payroll/Cargo.toml --all-targets -- -D warnings
      - name: WASM build
        run: cargo build --locked --release --target wasm32-wasip2 --manifest-path contracts/payroll/Cargo.toml

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
